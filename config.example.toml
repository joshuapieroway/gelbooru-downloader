[api]
base_url = "https://gelbooru.com"
user_id = ""
api_key = ""
timeout = 30

[downloads]
directory = "~/Pictures/Gelbooru"
concurrency = 16
max_retries = 5
resume = true
validate_files = true
skip_duplicates = true
# bandwidth_limit = 1048576

# Filename and folder layout. Placeholders: {id}, {md5}, {ext}, {rating},
# {score}, {score_desc}, {width}, {height}, {artist}, {copyright},
# {character}, {meta}, {title}, {source}, {tag_count}, {year}, {sort_prefix}.
# `{score_desc}` is a fixed-width inverted score so ascending filename order
# shows the highest score first. Unknown placeholders render empty and
# `{{` / `}}` produce literal braces.
# Folder segments are separated by `/` and sanitized like filenames.
filename_template = "{sort_prefix}{id}_{md5}.{ext}"
folder_template = ""
# folder_template = "{artist}/{rating}"

[search]
default_rating = "safe"
default_limit = 100
page_size = 100

[watch]
enabled = false
interval = 300

[database]
enabled = true
# path = "~/.local/share/gelbooru-downloader/history.db"
