[package]
name = "gelbooru-downloader"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "High-performance asynchronous Gelbooru API client and image downloader"
license = "MIT"
authors = ["Gelbooru Downloader Contributors"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
blake3 = "1"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
rustyline = "14"
console = "0.15"
dialoguer = "0.11"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
rand = "0.8"
humansize = "2"
mime_guess = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"

[[bin]]
name = "gelbooru"
path = "src/main.rs"
