[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gelbooru-downloader"
version = "1.1.0"
description = "A fast, async terminal client and downloader for the Gelbooru image board API."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Gelbooru Downloader Contributors" }]
keywords = ["gelbooru", "booru", "downloader", "cli", "async", "httpx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "Pillow>=10.0",
    "prompt_toolkit>=3.0",
]

[project.urls]
Homepage = "https://github.com/joshuapieroway/gelbooru-downloader"
Issues = "https://github.com/joshuapieroway/gelbooru-downloader/issues"

[project.scripts]
gelbooru = "gelbooru_downloader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gelbooru_downloader"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "T20", "ANN", "PTH", "ARG", "ASYNC", "S", "PL"]
ignore = [
    "ANN401",  # allow typing.Any where the API payload really is dynamic
    "S311",    # random is only used for --shuffle selection, not for security
    "PLC0415", # deliberate lazy imports keep CLI startup fast (and avoid cycles)
    "PLR0912", # a handful of CLI/parsing branches are legitimately branchy
    "PLR0913", # download options are a wide but flat set of knobs
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLR0911", # pure predicates (filters, coercion) read better with early returns
    "C901",
    "E501",    # line length is enforced by `ruff format`
    # Local-disk writes are deliberately done inline: per-chunk thread offloading
    # costs more than it saves, and HTTP concurrency (the real bottleneck) is
    # unaffected because file handles are buffered by the OS.
    "ASYNC230",
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"src/gelbooru_downloader/commands/*" = ["B008", "ANN401", "RUF001"]
# The "×" in dimension columns is intentional, not a look-alike typo.
"src/gelbooru_downloader/console.py" = ["RUF001"]
"tests/mock_server.py" = ["ANN", "ARG", "N802", "A002", "D", "T201", "SIM102"]

[tool.ruff.lint.flake8-bandit]
# Gelbooru's API speaks XML; the parser only ever receives API responses.
check-typed-exception = false

[tool.ruff.lint.pylint]
max-args = 20

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true